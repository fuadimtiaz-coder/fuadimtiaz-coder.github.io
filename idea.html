* {

}

body {
    margin: 0;

    color: #172033;
}

header {

}

header h1 {
    margin: 0;

}

header p {
    margin: 10px 0 0;

}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

#search {
    flex: 1;
    padding: 16px;
    border: 2px solid #d5dce8;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
}

#search:focus {
    border-color: #1976d2;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 15px;
    background: #1976d2;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.stats {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.word-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.word-card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    transition: 0.2s;
}

.word-card:hover {
    transform: translateY(-3px);
}

.word-card h2 {
    margin: 0 0 5px;
    color: #1455a0;
}

.type {
    color: #777;
    font-style: italic;
    margin-bottom: 10px;
}

.meaning {
    line-height: 1.5;
}

.small {
    color: #555;
    font-size: 14px;
    line-height: 1.5;
}

.favorite {
    background: #f0f3f7;
    color: #222;
    margin-top: 12px;
}

.favorite.active {
    background: #ffd54f;
}

#loadMore {
    display: block;
    margin: 25px auto;
}

.no-results {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

footer {
    text-align: center;
    padding: 30px;
    color: #666;
}

/* =========================================================

   ========================================================= */

let visibleWords = 20;
let currentWords = [...dictionary];

const wordList = document.getElementById("wordList");
const count = document.getElementById("count");
const searchInput = document.getElementById("search");


function displayWords() {

    wordList.innerHTML = "";

    const wordsToShow = currentWords.slice(0, visibleWords);

    if (wordsToShow.length === 0) {

        wordList.innerHTML = `
            <div class="no-results">
                <h2>Word not found</h2>
                <p>Try another spelling or search term.</p>
            </div>
        `;

        document.getElementById("loadMore").style.display = "none";
        count.textContent = "0 words found";
        return;
    }

    wordsToShow.forEach((item, index) => {

        const card = document.createElement("div");

        card.className = "word-card";

        const saved =
            localStorage.getItem("favorite_" + item.word) === "true";

        card.innerHTML = `

            <h2>${item.word}</h2>

            <div class="type">
                ${item.type}
            </div>

            <div class="meaning">
                <strong>Meaning:</strong><br>
                ${item.meaning}
            </div>

            <p class="small">
                <strong>Example:</strong><br>
                ${item.example}
            </p>

            <p class="small">
                <strong>Synonyms:</strong><br>
                ${item.synonyms || "None"}
            </p>

            <p class="small">
                <strong>Antonyms:</strong><br>
                ${item.antonyms || "None"}
            </p>

            <button
                class="favorite ${saved ? "active" : ""}"
                onclick="toggleFavorite('${item.word}', this)"
            >
                ${saved ? "★ Favorite" : "☆ Add Favorite"}
            </button>
        `;

        wordList.appendChild(card);
    });

    count.textContent =
        currentWords.length + " word(s) found • Showing " +
        Math.min(visibleWords, currentWords.length);

    const loadButton = document.getElementById("loadMore");

    if (visibleWords >= currentWords.length) {
        loadButton.style.display = "none";
    } else {
        loadButton.style.display = "block";
    }
}


function loadMore() {

    visibleWords += 20;

    displayWords();
}


function searchWords() {

    const query =
        searchInput.value.toLowerCase().trim();

    visibleWords = 20;

    if (query === "") {

        currentWords = [...dictionary];

    } else {

        currentWords = dictionary.filter(item =>

            item.word.toLowerCase().includes(query) ||

            item.meaning.toLowerCase().includes(query) ||

            item.synonyms.toLowerCase().includes(query) ||

            item.antonyms.toLowerCase().includes(query)

        );
    }

    displayWords();
}


function toggleFavorite(word, button) {

    const key = "favorite_" + word;

    const isFavorite =
        localStorage.getItem(key) === "true";

    if (isFavorite) {

        localStorage.removeItem(key);

        button.classList.remove("active");

        button.textContent = "☆ Add Favorite";

    } else {

        localStorage.setItem(key, "true");

        button.classList.add("active");

        button.textContent = "★ Favorite";
    }
}


/* Search automatically while typing */

searchInput.addEventListener("input", searchWords);


/* Start dictionary */

displayWords();html
