<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Dictionary</title>

<style>
body{font-family:Arial;margin:0;padding:20px;background:#f5f5f5}
h1{text-align:center}
input{width:100%;box-sizing:border-box;padding:15px;font-size:18px;border:1px solid #aaa;border-radius:10px}
#result{background:white;margin-top:20px;padding:20px;border-radius:10px}
.word{font-size:30px;font-weight:bold}
.meaning{font-size:18px;margin-top:12px;line-height:1.6}
</style>
</head>

<body>

<h1>📖 English Dictionary</h1>

<input id="search" placeholder="Search an English word...">

<div id="result">Type a word above.</div>

<script>
let dictionary={};

fetch("dictionary.json")
.then(r=>r.json())
.then(data=>{
 dictionary=data;
});

document.getElementById("search").addEventListener("input",function(){

let word=this.value.toLowerCase().trim();
let result=document.getElementById("result");

if(!word){
 result.innerHTML="Type a word above.";
 return;
}

let entry=dictionary[word];

if(entry){
 result.innerHTML=
 '<div class="word">'+word+'</div>'+
 '<div class="meaning">'+
 (typeof entry==="string"?entry:JSON.stringify(entry))+
 '</div>';
}else{
 result.innerHTML="Word not found.";
}

});
</script>

</body>
</html>
